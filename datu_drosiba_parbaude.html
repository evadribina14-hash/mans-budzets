<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datu drošības pārbaude</title>
<style>
body{font-family:Arial,sans-serif;background:#f5fafe;margin:0;padding:24px;color:#24384a}
.card{max-width:600px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:22px}
.status{padding:16px;border-radius:14px;background:#e8f5ec;margin:18px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f9;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<h1>Datu drošības pārbaude</h1>
<div id="status" class="status">Pārbaudu automātisko rezerves kopiju...</div>
<div id="details"></div>
</div>
<script>
const DB_NAME='mans_budzets_safety_v1';
const STORE='snapshots';
const KEY='latest';

function show(text, ok=true){
  document.getElementById('status').textContent=text;
  document.getElementById('status').style.background=ok?'#e8f5ec':'#fdeaea';
}
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME);
    r.onerror=()=>reject(r.error);
    r.onsuccess=()=>resolve(r.result);
    r.onupgradeneeded=()=>{};
  });
}
(async()=>{
  try{
    const db=await openDB();
    const tx=db.transaction(STORE,'readonly');
    const store=tx.objectStore(STORE);
    const req=store.get(KEY);
    req.onerror=()=>show('Neizdevās nolasīt rezerves kopiju.',false);
    req.onsuccess=()=>{
      const snap=req.result;
      if(!snap || !snap.data){
        show('Automātiskā rezerves kopija vēl nav atrasta.',false);
        return;
      }
      const keys=Object.keys(snap.data||{});
      const budgetRaw=snap.data.mans_budzets_v3;
      let entries=0;
      try{ entries=Array.isArray(JSON.parse(budgetRaw||'[]'))?JSON.parse(budgetRaw||'[]').length:0; }catch(e){}
      show('Automātiskā rezerves kopija IR atrasta.');
      document.getElementById('details').innerHTML=
        '<p><b>Budžeta ieraksti:</b> '+entries+'</p>'+
        '<p><b>Saglabātās atslēgas:</b> '+keys.length+'</p>'+
        '<p><b>Kopijas veids:</b> '+(snap.reason||'automātiska')+'</p>'+
        '<p><b>Kopijas laiks:</b> '+(snap.time?new Date(snap.time).toLocaleString('lv-LV'):'nav norādīts')+'</p>';
    };
  }catch(e){
    show('Rezerves kopiju nevar pārbaudīt šajā pārlūkā.',false);
    document.getElementById('details').innerHTML='<pre>'+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
