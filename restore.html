<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mans budžets — datu atjaunošana</title><style>body{font-family:Arial;background:#edf7fc;color:#314454;padding:20px}main{max-width:600px;margin:auto;background:#fff;border-radius:20px;padding:22px}button,input{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px}button{border:0;background:#8dbbd8;color:#fff;font-size:17px}#s{margin-top:15px;line-height:1.5}</style></head><body><main><h1>Mans budžets — datu atjaunošana</h1><p>Šī lapa ir paredzēta lietotnes vietnes krātuvei. Tā neko nedzēš, kamēr pati neizvēlies atjaunot datus.</p><input id="f" type="file" accept="*/*"><div id="s"></div><button id="b" disabled>Atjaunot datus šajā vietnē</button></main><script>let backup=null;f.onchange=async()=>{try{const t=await f.files[0].text();backup=JSON.parse(t);const ls=backup.localStorage||{};const a=JSON.parse(ls.mans_budzets_v3||'[]');s.innerHTML='<b>Rezerves kopija atrasta.</b><br>Budžeta ieraksti: '+a.length+'<br>Visas saglabātās atslēgas: '+Object.keys(ls).length;b.disabled=false}catch(e){backup=null;b.disabled=true;s.textContent='Šis fails nav derīga Mans budžets rezerves kopija.'}};b.onclick=()=>{const ls=backup.localStorage;Object.keys(ls).forEach(k=>localStorage.setItem(k,String(ls[k])));s.innerHTML='<b>Dati atjaunoti!</b><br>Tagad aizver šo lapu un atver Mans budžets no jauna.';b.disabled=true};</script></body></html>
